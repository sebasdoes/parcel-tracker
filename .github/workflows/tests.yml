name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Regression suite (host python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: python3 -m py_compile tracker.py tests/smoke_test.py
      - name: Sample-mode smoke test
        run: python3 tests/smoke_test.py

  container:
    name: Regression (inside the image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t vinted-tracker:test .
      - name: Sample-mode serve + probe
        run: |
          docker run -d --rm --name vt-serve -e SAMPLE=1 -p 8080:8080 vinted-tracker:test
          sleep 5
          curl -sf http://127.0.0.1:8080/healthz | grep -q '"ok": true'
          curl -sf http://127.0.0.1:8080/api/overview.json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d["transactions"]) == 3, "expected 3 sample transactions"'
          curl -sf http://127.0.0.1:8080/ | grep -q "Awaiting pick-up"
          docker stop vt-serve

  publish:
    name: Build and push image to ghcr.io
    if: github.event_name != 'pull_request'
    needs: [host, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Compute lowercase image name
        id: image
        run: |
          echo "name=ghcr.io/$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=long
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max